name: Sanity Netcup Deployment

# Wann soll dieses Skript starten?
on:
  push:
    branches:
      - main # Startet automatisch, wenn du Code-Updates hochlädst
  repository_dispatch:
    types: [sanity-publish] # DAS ist das Signal, auf das wir von Sanity warten!

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Code herunterladen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ⚙️ Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # Nutze deine aktuelle Node-Version

      - name: 📦 Pakete installieren
        run: npm ci # Schneller und sicherer als npm install für Server

      - name: 🏗️ Projekt bauen (Static Export)
        run: npm run build

      - name: PHP-Kontaktformular sicher testen
        run: |
          docker run --rm --user 65534:65534 --network none --read-only --tmpfs /tmp:rw,nosuid,size=16m \
            --mount "type=bind,source=$PWD,target=/project,readonly" \
            -e FRIEDEMANN_RATE_LIMIT_DIR=/tmp/contact-rate \
            php:8.3-cli@sha256:f1ed6d1fd0aa769ab94ca307b9deaf55fbc18434315b70e319cd79078515cd2b \
            php /project/security/tests/contact-mailer.php

      - name: Kontaktformular-Backend bereitstellen
        run: |
          mkdir -p out/api
          cp src/api/mailer.php out/api/mailer.php

      - name: 🚀 FTP Upload zu Netcup
        uses: SamKirkland/FTP-Deploy-Action@fe9c9aad1198372d80a77c8dace63cbe48b69eac # v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: friedemann-webdesign.de/httpdocs/
          state-name: .ftp-deploy-sync-state.json # Hilft, nur Änderungen hochzuladen und Verbindungsabbrüche zu vermeiden
